{{- $a := site.Params.author -}}
{{- $sameAs := slice -}}
{{- range $a.links }}{{ range $k, $v := . }}{{ if ne $k "email" }}{{ $sameAs = $sameAs | append $v }}{{ end }}{{ end }}{{ end -}}
<script type="application/ld+json">
{{ dict "@context" "https://schema.org" "@type" "Person" "name" $a.name "jobTitle" $a.headline "url" site.Home.Permalink "affiliation" (dict "@type" "CollegeOrUniversity" "name" "University of Geneva") "sameAs" $sameAs | jsonify | safeJS }}
</script>
