<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 312' role='img' aria-label='La difficulté suit le joueur, l’histoire montre la progression' font-family='Inter, system-ui, sans-serif' font-size='13'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8A9099'/></marker></defs>
<text x='24' y='34' font-size='15' font-weight='600' text-anchor='start' fill='#17181A'>La difficulté suit le joueur, l’histoire montre la progression</text>
<g fill='none' stroke='#8A9099' stroke-width='1.25'><path d='M168 128H190' marker-end='url(#arrow)'/><path d='M390 128H408' marker-end='url(#arrow)'/><path d='M572 128H592' marker-end='url(#arrow)'/><path d='M660 100V64H290V92' marker-end='url(#arrow)'/><path d='M290 164V232' marker-end='url(#arrow)'/><path d='M415 260H422' marker-end='url(#arrow)'/></g>
<rect x='24' y='100' width='144' height='56' rx='8' fill='none' stroke='#8A9099' stroke-width='1.25'/>
<text x='96' y='124' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Tutoriel</text>
<text x='96' y='142' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>énonce l’objectif</text>
<rect x='190' y='92' width='200' height='72' rx='8' fill='#1B6B58' fill-opacity='0.12' stroke='#1B6B58' stroke-width='2'/>
<text x='290' y='116' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Essai</text>
<text x='290' y='134' font-size='11.5' font-weight='400' text-anchor='middle' fill='#17181A'>suivre les vaisseaux</text>
<text x='290' y='150' font-size='11.5' font-weight='400' text-anchor='middle' fill='#17181A'>attraper les papillons</text>
<rect x='408' y='100' width='164' height='56' rx='8' fill='none' stroke='#8A9099' stroke-width='1.25'/>
<text x='490' y='124' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Retour immédiat</text>
<text x='490' y='142' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>recruté ou manqué</text>
<rect x='592' y='100' width='136' height='56' rx='8' fill='none' stroke='#8A9099' stroke-width='1.25'/>
<text x='660' y='124' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Adaptation</text>
<text x='660' y='142' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>vitesse ajustée</text>
<rect x='165' y='232' width='250' height='56' rx='8' fill='none' stroke='#8A9099' stroke-width='1.25'/>
<text x='290' y='256' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Fin de niveau</text>
<text x='290' y='274' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>stats, carte, planète restaurée</text>
<rect x='422' y='232' width='150' height='56' rx='8' fill='none' stroke='#8A9099' stroke-width='1.25'/>
<text x='497.0' y='256' font-size='13' font-weight='600' text-anchor='middle' fill='#17181A'>Planète suivante</text>
<text x='497.0' y='274' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>charge plus élevée</text>
<text x='475' y='58' font-size='11.5' font-weight='400' text-anchor='middle' fill='#5A6069'>essai suivant, vitesse selon le joueur, cible 80 % de réussite</text>
</svg>